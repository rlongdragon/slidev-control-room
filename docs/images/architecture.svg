    <text class="node-detail" x="1306" y="233">公開 / 開始 / 切換</text>
  </g>
  <g>
    <rect x="1210" y="330" width="295" height="105" rx="10" fill="#FFF6ED" stroke="#F79009" stroke-width="1.5" filter="url(#softShadow)" />
    <g transform="translate(1237 359)" color="#DC6803">
      <rect class="icon" x="0" y="0" width="48" height="33" rx="3" />
      <path class="icon" d="M8 41 H40 M18 33 L15 41 M30 33 L33 41" />
      <circle cx="24" cy="13" r="5" fill="none" stroke="#DC6803" stroke-width="2" />
      <path class="icon" d="M15 28 C17 20 31 20 33 28" />
    </g>
    <text class="node-title" x="1306" y="372">Presenter</text>
    <text class="node-detail" x="1306" y="402">登入 session 控制頁碼</text>
  </g>
  <g>
    <rect class="node" x="1210" y="515" width="295" height="105" rx="10" stroke="#65BEB7" />
    <g transform="translate(1234 548)" color="#0E9384">
      <rect class="icon" x="0" y="8" width="25" height="20" rx="2" />
      <rect class="icon" x="15" y="0" width="25" height="20" rx="2" />
      <rect class="icon" x="30" y="8" width="25" height="20" rx="2" />
      <path class="icon" d="M7 34 H48" />
    </g>
    <text class="node-title" x="1306" y="556">觀眾畫面 × N</text>
    <text class="node-detail" x="1306" y="586">固定 <tspan class="code">/slide/&lt;id&gt;/</tspan> 連結</text>
  </g>
  <g>
    <rect class="node" x="1210" y="690" width="295" height="88" rx="10" stroke="#65BEB7" />
    <g transform="translate(1239 709)" color="#0E9384">
      <path class="icon" d="M4 0 H29 L40 11 V46 H4 Z M29 0 V11 H40" />
      <path class="icon" d="M22 18 V35 M14 28 L22 36 L30 28" />
